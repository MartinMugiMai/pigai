<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>后台输出 · Pigai</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #1e2229;
      color: #d8dee6;
      font-family: 'Cascadia Mono', Consolas, 'Microsoft YaHei', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #272c34;
      border-bottom: 1px solid #3a404a;
    }
    .toolbar button {
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      transition: 0.15s;
    }
    .toolbar button:hover { background: #2f6fe0; }
    .toolbar button:active { transform: scale(0.97); }
    .save-hint {
      font-size: 12px;
      color: #9aa5b1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .log-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      font-size: 12.5px;
      line-height: 1.6;
    }
    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid #2b303a;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-head { color: #7d8b9c; }
    .src-renderer { color: #e5c07b; }
    .src-main { color: #7ec8e3; }
    .lv-error { color: #e06c75; font-weight: 600; }
    .lv-warn { color: #e5c07b; font-weight: 600; }
    .lv-info { color: #98c379; }
    .empty { color: #6b7480; font-style: italic; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="saveBtn">💾 一键保存 TXT</button>
    <span class="save-hint" id="saveHint">共 0 条输出（主进程 print + 渲染层 console）</span>
  </div>
  <div class="log-area" id="logArea">
    <p class="empty">暂无输出。程序运行中的所有后端 print 与渲染层 console 会实时显示在这里。</p>
  </div>
  <script src="js/backend.js"></script>
</body>
</html>
