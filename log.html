<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>请求日志 · Pigai</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f1ea;
      font-family: 'Cascadia Mono', Consolas, 'Microsoft YaHei', monospace;
      color: #2f241b;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #fdfaf6;
      border-bottom: 1px solid #d6c9ba;
    }
    .toolbar button {
      background: #c9b7a4;
      border: 1px solid #b8a48e;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #1f160f;
      transition: 0.15s;
    }
    .toolbar button:hover { background: #bfac96; }
    .toolbar button:active { transform: scale(0.97); }
    .save-hint {
      font-size: 12px;
      color: #5f4a36;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .log-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      font-size: 12.5px;
      line-height: 1.55;
    }
    .log-entry {
      background: #fffdf8;
      border: 1px solid #e2d6c8;
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-head { font-weight: 600; margin-bottom: 4px; }
    .t-请求 { color: #1d4ed8; }
    .t-响应 { color: #166534; }
    .t-错误 { color: #b13e3e; }
    .t-配置 { color: #7a5f48; }
    .empty { color: #b09b8a; font-style: italic; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="saveBtn">💾 一键保存 TXT</button>
    <span class="save-hint" id="saveHint">共 0 条记录</span>
  </div>
  <div class="log-area" id="logArea">
    <p class="empty">暂无日志。发起一次作文批改后，请求与响应会实时显示在这里。</p>
  </div>
  <script src="js/log.js"></script>
</body>
</html>
